name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build (debug)
        run: swift build
      - name: Build (release)
        run: swift build -c release
      - name: EQ checks
        run: swift run -c release EQCheck
